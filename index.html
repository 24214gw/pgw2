<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI CEO 창업 시뮬레이터 & 경영 대시보드</title>
  <style>
    /* 프리미엄 다크 모드 경영 대시보드 스타일링 */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0F172A;
      color: #E2E8F0;
      font-family: 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
      min-height: 100vh;
    }
    .container {
      width: min(1100px, 100%);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    /* 상단 네비게이션 및 로그인 바 */
    header {
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { font-size: 22px; color: #38BDF8; font-weight: bold; }
    .auth-box { display: flex; align-items: center; gap: 15px; }
    .user-info { font-size: 14px; color: #94A3B8; }
    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-primary { background: #0EA5E9; color: white; }
    .btn-primary:hover { background: #38BDF8; }
    .btn-success { background: #10B981; color: white; }
    .btn-success:hover { background: #34D399; }

    /* 메인 대시보드 레이아웃 (2분할) */
    .main-content {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 20px;
    }
    @media (max-width: 768px) {
      .main-content { grid-template-columns: 1fr; }
    }

    /* 왼쪽: 경영 지표 대시보드 */
    .dashboard-panel {
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 25px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .panel-title { font-size: 18px; font-weight: bold; color: #F1F5F9; border-left: 4px solid #0EA5E9; padding-left: 10px; }
    .status-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .card { background: #0F172A; border: 1px solid #334155; border-radius: 12px; padding: 15px; }
    .card-label { font-size: 12px; color: #94A3B8; margin-bottom: 5px; }
    .card-value { font-size: 22px; font-weight: bold; color: #F8FAFC; }
    
    /* API 키 입력 공간 (보안 우회용) */
    .api-box {
      background: #273549;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
    }
    .api-box input {
      width: 100%; background: #0F172A; border: 1px solid #475569;
      color: white; padding: 6px; border-radius: 6px; margin-top: 5px; outline: none;
    }

    /* 오른쪽: AI 수석 경영 컨설턴트 룸 */
    .ai-panel {
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      height: 550px;
      overflow: hidden;
    }
    .ai-header { background: #334155; padding: 15px 20px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
    .live-dot { width: 8px; height: 8px; background: #10B981; border-radius: 50%; }
    .chat-space { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
    
    /* 말풍선 스타일 */
    .msg { display: flex; max-width: 85%; font-size: 14px; line-height: 1.5; }
    .msg.user { align-self: flex-end; }
    .msg.ai { align-self: flex-start; }
    .bubble { padding: 12px 16px; border-radius: 16px; }
    .user .bubble { background: #0EA5E9; color: white; border-top-right-radius: 0; }
    .ai .bubble { background: #334155; color: #F1F5F9; border-top-left-radius: 0; }

    /* 하단 입력창 */
    .chat-footer { padding: 15px; background: #1E293B; border-top: 1px solid #334155; display: flex; gap: 10px; }
    .chat-footer input {
      flex: 1; background: #0F172A; border: 1px solid #334155; border-radius: 10px;
      padding: 0 15px; color: white; outline: none;
    }
    .chat-footer input:focus { border-color: #0EA5E9; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>💼 글로벌 CEO 경영 시뮬레이터</h1>
      <div class="auth-box">
        <span class="user-info" id="userStatus">경영자 로그인이 필요합니다.</span>
        <button class="btn btn-primary" id="authBtn">CEO 구글 로그인</button>
      </div>
    </header>

    <div class="main-content">
      <section class="dashboard-panel">
        <div class="panel-title">실시간 기업 경영 지표 (Firebase 연동)</div>
        <div class="status-cards">
          <div class="card">
            <div class="card-label">회사 자본금</div>
            <div class="card-value" id="valCapital">100,000,000 원</div>
          </div>
          <div class="card">
            <div class="card-label">기업 브랜드 평판</div>
            <div class="card-value" id="valReputation">50 점</div>
          </div>
          <div class="card">
            <div class="card-label">정규직 직원 수</div>
            <div class="card-value" id="valEmployees">5 명</div>
          </div>
          <div class="card">
            <div class="card-label">회사 누적 매출</div>
            <div class="card-value" id="valSales">0 원</div>
          </div>
        </div>

        <div class="api-box">
          <label for="apiKeyInput">🔑 OpenAI API Key (깃허브 보호를 위해 화면 입력 권장):</label>
          <input type="password" id="apiKeyInput" placeholder="sk-proj-..." value="">
          <p style="font-size: 11px; color:#94A3B8; margin-top:5px;">* 주신 키를 여기에 입력하고 시작하면 해킹 차단 없이 안전하게 작동합니다.</p>
        </div>
        
        <button class="btn btn-success" id="saveBtn" disabled>현재 경영 상태 저장하기</button>
      </section>

      <section class="ai-panel">
        <div class="ai-header">
          <div class="live-dot"></div>
          <span>AI 수석 경영 컨설턴트 (McKinsey 출신 AI)</span>
        </div>
        
        <div class="chat-space" id="chatSpace">
          <div class="msg ai">
            <div class="bubble">반갑습니다, CEO님! 회사의 투자, 고용, 마케팅 등 경영 관련 고민을 질문해 주세요. 전문적인 분석 보고서를 제공하고 음성 브리핑을 시작하겠습니다.</div>
          </div>
        </div>

        <div class="chat-footer">
          <input type="text" id="bizInput" placeholder="예) 자본금 3천만원을 들여 마케팅을 공격적으로 진행할까?" disabled>
          <button class="btn btn-primary" id="sendBtn" disabled>결정 내리기</button>
        </div>
      </section>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 팩트 체크: 본인의 Firebase 프로젝트 설정(Config)을 복사해서 여기에 넣으시면 연동이 완료됩니다.
    const firebaseConfig = {
      apiKey: "AIzaSyDG_Rb40GvwisGKDtSqLXUYN87JO7tsdSE",
      authDomain: "test-ad453.firebaseapp.com",
      databaseURL: "https://test-ad453-default-rtdb.firebaseio.com",
      projectId: "test-ad453",
      storageBucket: "test-ad453.firebasestorage.app",
      messagingSenderId: "595840516346",
      appId: "1:595840516346:web:7faa85b427d422d926c943",
      measurementId: "G-WYJ960780L"
    };
    // Firebase 초기화
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // 초기 가상 경영 데이터 세팅
    let companyData = {
      capital: 100000000,
      reputation: 50,
      employees: 5,
      sales: 0
    };

    let currentUser = null;

    // UI 요소 매핑
    const authBtn = document.getElementById("authBtn");
    const userStatus = document.getElementById("userStatus");
    const bizInput = document.getElementById("bizInput");
    const sendBtn = document.getElementById("sendBtn");
    const saveBtn = document.getElementById("saveBtn");

    // [기준 3] Firebase Authentication (구글 로그인 기능 구현)
    authBtn.addEventListener("click", async () => {
      if (!currentUser) {
        try {
          await signInWithPopup(auth, provider);
        } catch (err) {
          alert("로그인 실패: " + err.message);
        }
      } else {
        await signOut(auth);
        location.reload();
      }
    });

    // 인증 상태 실시간 모니터링 및 [기준 2] 데이터 불러오기 연동
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        userStatus.innerText = `👑 CEO [${user.displayName}] 로그인됨`;
        authBtn.innerText = "로그아웃";
        bizInput.disabled = false;
        sendBtn.disabled = false;
        saveBtn.disabled = false;

        // Firestore에서 기존 경영 데이터가 있는지 체크하고 불러오기
        const docRef = doc(db, "company_sim", user.uid);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          companyData = docSnap.data();
          updateDashboardUI();
        }
      } else {
        currentUser = null;
      }
    });

    // [기준 2] Firebase 데이터 저장 연동 기능
    saveBtn.addEventListener("click", async () => {
      if (!currentUser) return;
      try {
        await setDoc(doc(db, "company_sim", currentUser.uid), companyData);
        alert("📊 현재 경영 자산 상태가 Cloud Firestore에 안전하게 저장되었습니다!");
      } catch (err) {
        alert("저장 실패: " + err.message);
      }
    });

    // 대시보드 화면 숫자를 동적으로 바꿔주는 함수
    function updateDashboardUI() {
      document.getElementById("valCapital").innerText = companyData.capital.toLocaleString() + " 원";
      document.getElementById("valReputation").innerText = companyData.reputation + " 점";
      document.getElementById("valEmployees").innerText = companyData.employees + " 명";
      document.getElementById("valSales").innerText = companyData.sales.toLocaleString() + " 원";
    }

    // 전역 비즈니스 로직 연동을 위해 변수 바인딩
    window.companyData = companyData;
    window.updateDashboardUI = updateDashboardUI;
  </script>

  <script>
    const chatSpace = document.getElementById("chatSpace");
    const bizInput = document.getElementById("bizInput");
    const sendBtn = document.getElementById("sendBtn");
    const apiKeyInput = document.getElementById("apiKeyInput");

    // 엔터키 작동 트리거
    bizInput.addEventListener("keydown", (e) => {
      if (e.key === 'Enter') executeStrategy();
    });
    sendBtn.addEventListener("click", executeStrategy);

    // 핵심 매니지먼트 전략 실행 프로세스
    async function executeStrategy() {
      const query = bizInput.value.trim();
      const apiKey = apiKeyInput.value.trim();

      if (!query) return;
      if (!apiKey) {
        alert("🔑 대시보드 좌측 하단에 OpenAI API Key를 입력하셔야 컨설팅을 시작할 수 있습니다!");
        return;
      }

      // 1. 유저 기획서 화면에 표출
      renderMsg(query, 'user');
      bizInput.value = "";

      // 2. AI 가상 대기실 가동
      renderMsg("AI가 시장 트렌드 및 재무제표 시뮬레이션을 분석 중입니다...", 'loading');

      // 경영 컨설턴트 튜닝 프롬프트 결합
      const systemPrompt = `너는 세계적인 경영 컨설팅 회사 출신의 AI 수석 고문이야. 회사 경영진의 질문이나 지출 계획을 듣고, 경제학적 관점 및 리스크를 정밀 분석하여 앞으로의 조언을 친절하고 스마트하게 딱 3문장 이내로 요약해서 한국어로 답해줘. 경영 정보: ${query}`;

      try {
        // [기준 4] 생성형 인공지능 API 실시간 통신 (GPT 모델 최적화)
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: "gpt-4o-mini", // 비용 효율성과 속도가 가장 뛰어난 최신 스펙 모델
            messages: [{ role: "user", content: systemPrompt }],
            temperature: 0.7
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const aiReport = data.choices[0].message.content;

        // 로딩 안내판 제거 후 결과 보고서 매핑
        removeLoading();
        renderMsg(aiReport, 'ai');

        // [기준 5] TTS(Text-to-Speech) 브리핑 기능 가동
        playTTS(aiReport);

        // 시뮬레이터 수치 실시간 가동 (단어 조건문형 수식 엔진)
        applyBusinessResult(query);

      } catch (err) {
        removeLoading();
        const errorAlert = "인공지능 망에 접속할 수 없습니다. API 키 상태를 확인하세요.";
        renderMsg(errorAlert, 'ai');
        playTTS(errorAlert);
      }
    }

    // 화면 말풍선 빌더 함수
    function renderMsg(text, type) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg ${type}`;
      if (type === 'loading') msgDiv.id = "loadingBox";
      msgDiv.innerHTML = `<div class="bubble">${text}</div>`;
      chatSpace.appendChild(msgDiv);
      chatSpace.scrollTop = chatSpace.scrollHeight;
    }

    function removeLoading() {
      const target = document.getElementById("loadingBox");
      if (target) target.remove();
    }

    // [기준 5] 웹 표준 스피치 API를 활용한 고성능 TTS 구현
    function playTTS(text) {
      window.speechSynthesis.cancel(); // 겹침 방지 초기화
      const speech = new SpeechSynthesisUtterance(text);
      speech.lang = "ko-KR";
      speech.rate = 1.05; // 실제 리포터 수준의 자연스러운 속도감
      window.speechSynthesis.speak(speech);
    }

    // 유저의 결정 단어 분석형 파이낸스 알고리즘
    function applyBusinessResult(text) {
      if (!window.companyData) return;

      if (text.includes("마케팅") || text.includes("투자") || text.includes("광고")) {
        window.companyData.capital -= 20000000;
        window.companyData.reputation += 25;
        window.companyData.sales += 35000000;
      } else if (text.includes("고용") || text.includes("직원") || text.includes("채용")) {
        window.companyData.capital -= 10000000;
        window.companyData.employees += 2;
        window.companyData.sales += 15000000;
      } else {
        window.companyData.reputation += 5;
        window.companyData.sales += 5000000;
      }
      
      // 변경 사항 대시보드 화면에 즉각 투영
      window.updateDashboardUI();
    }
  </script>
</body>
</html>
