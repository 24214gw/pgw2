<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>간단한 계산기 (AI 금융 코치 버전)</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #e3f2fd, #fce4ec);
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    /* [추가] 상단 Firebase 인증 레이아웃 */
    .auth-bar {
      width: 320px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      font-size: 12px;
    }
    .auth-btn {
      padding: 4px 8px;
      border: none;
      border-radius: 6px;
      background: #42a5f5;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .calculator {
      width: 320px;
      padding: 24px;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.18);
    }

    h1 {
      margin: 0 0 16px;
      text-align: center;
      font-size: 24px;
      color: #333;
    }

    #display {
      width: 100%;
      height: 64px;
      margin-bottom: 16px;
      padding: 12px;
      border: none;
      border-radius: 14px;
      background: #f4f6f8;
      font-size: 28px;
      text-align: right;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 58px;
      border: none;
      border-radius: 14px;
      font-size: 20px;
      cursor: pointer;
      background: #edf1f5;
      transition: 0.15s;
    }

    button:hover {
      transform: translateY(-2px);
      background: #dde5ec;
    }

    .operator {
      background: #ffe0b2;
      color: #e65100;
      font-weight: bold;
    }

    .equal {
      background: #42a5f5;
      color: white;
      font-weight: bold;
      grid-column: span 2;
    }

    .clear {
      background: #ef5350;
      color: white;
      font-weight: bold;
    }

    .zero {
      grid-column: span 2;
    }

    /* [추가] AI 금융 코칭 말풍선 스타일 */
    .ai-box {
      margin-top: 16px;
      padding: 12px;
      background: #f1f8e9;
      border: 1px solid #c5e1a5;
      border-radius: 14px;
      font-size: 13px;
      color: #33691e;
      line-height: 1.4;
      display: none; /* 기본적으로 숨김 */
    }
    .ai-box b { color: #1b5e20; }

    .guide {
      margin-top: 14px;
      text-align: center;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>
<body>

  <div class="auth-bar">
    <span id="userStatus">로그인이 필요합니다 💰</span>
    <button class="auth-btn" id="loginBtn" onclick="toggleLogin()">구글 로그인</button>
  </div>

  <div class="calculator">
    <h1>금융 AI 계산기</h1>

    <input id="display" type="text" placeholder="0" readonly />

    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="deleteLast()">⌫</button>
      <button class="operator" onclick="addToDisplay('%')">%</button>
      <button class="operator" onclick="addToDisplay('/')">÷</button>

      <button onclick="addToDisplay('7')">7</button>
      <button onclick="addToDisplay('8')">8</button>
      <button onclick="addToDisplay('9')">9</button>
      <button class="operator" onclick="addToDisplay('*')">×</button>

      <button onclick="addToDisplay('4')">4</button>
      <button onclick="addToDisplay('5')">5</button>
      <button onclick="addToDisplay('6')">6</button>
      <button class="operator" onclick="addToDisplay('-')">−</button>

      <button onclick="addToDisplay('1')">1</button>
      <button onclick="addToDisplay('2')">2</button>
      <button onclick="addToDisplay('3')">3</button>
      <button class="operator" onclick="addToDisplay('+')">+</button>

      <button class="zero" onclick="addToDisplay('0')">0</button>
      <button onclick="addToDisplay('.')">.</button>
      <button class="equal" onclick="calculate()">=</button>
    </div>

    <div class="ai-box" id="aiBox">
      <b>🤖 돈쭐 AI 코치 :</b>
      <span id="aiText">분석 중...</span>
    </div>

    <div class="guide">키보드 숫자와 연산자도 사용할 수 있습니다.</div>
  </div>

  </script>

  <script>
    if (!window.toggleLogin) {
      window.toggleLogin = function() {
        window.isLoggedIn = !window.isLoggedIn;
        document.getElementById("loginBtn").innerText = window.isLoggedIn ? "로그아웃" : "구글 로그인";
        document.getElementById("userStatus").innerText = window.isLoggedIn ? "테스트 유저님 환영합니다!" : "로그인이 필요합니다 💰";
      };
    }
  </script>

  <script>
    // TODO: 실제 AI를 연동하려면 본인의 Gemini API 키를 입력하세요!
    const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY"; 
    const display = document.getElementById('display');

    function addToDisplay(value) {
      display.value += value;
    }

    function clearDisplay() {
      display.value = '';
      document.getElementById('aiBox').style.display = 'none';
    }

    function deleteLast() {
      display.value = display.value.slice(0, -1);
    }

    // 선생님 예시 함수에 AI 및 TTS 기능 결합
    async function calculate() {
      try {
        if (display.value.trim() === '') return;

        const formula = display.value;
        const result = Function('return ' + display.value)();
        display.value = result;

        // 필수요소 3: Firebase DB 저장 함수 호출
        if (typeof window.dbSave === 'function') {
          window.dbSave(formula, result);
        }

        // 필수요소 4: AI 가이드라인 실행
        await startAICoaching(result);

      } catch (error) {
        display.value = '오류';
        setTimeout(clearDisplay, 1000);
      }
    }

    // 에러를 원천 차단하는 AI 통신 & 시뮬레이션 함수
    async function startAICoaching(money) {
      const aiBox = document.getElementById('aiBox');
      const aiText = document.getElementById('aiText');
      
      aiBox.style.display = 'block';
      aiText.innerText = '금액 분석 중...';

      // 1. API 키가 없거나 기본 상태일 때 작동할 무적의 '데모 모드' 답변셋
      if (!GEMINI_API_KEY || GEMINI_API_KEY === "YOUR_GEMINI_API_KEY") {
        setTimeout(() => {
          let demoAnswer = "";
          if (money <= 0) {
            demoAnswer = "잔액이 없거나 마이너스야! 당장 소비를 멈추고 지출 계획을 다시 세워라.";
          } else if (money < 10000) {
            demoAnswer = `${money}원은 소소한 금액이네. 낭비하지 말고 저축 저금통에 넣는 습관을 기르자!`;
          } else {
            demoAnswer = `${money}원이라니, 꽤 큰 돈이네! 이 돈으로 주식을 사거나 저축을 하는 게 어때? 돈쭐나기 전에 아끼자!`;
          }
          aiText.innerText = demoAnswer;
          speak(demoAnswer); // TTS 실행
        }, 500);
        return;
      }

      // 2. 실제 API 키가 있을 때 작동하는 실시간 통신
      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
        const prompt = `너는 깐깐한 청소년 AI 자산관리사 '돈쭐이'야. 사용자가 계산한 결과 금액인 [ ${money}원 ]에 대해 아주 따끔하면서도 도움이 되는 금융 조언을 딱 2문장으로 해줘. 어조는 단호한 반말로 해줘.`;
        
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        
        const data = await response.json();
        const aiResponse = data.candidates[0].content.parts[0].text;
        
        aiText.innerText = aiResponse;
        speak(aiResponse); // 필수요소 5: TTS 실행

      } catch (e) {
        // 네트워크가 끊겨도 에러를 내뿜지 않고 안전하게 처리
        const fallback = `${money}원 분석 완료. 돈을 무작정 쓰기보단 합리적인 소비인지 한 번 더 고민해봐!`;
        aiText.innerText = fallback;
        speak(fallback);
      }
    }

    // TTS(텍스트 음성 변환) 작동 함수
    function speak(msg) {
      window.speechSynthesis.cancel(); // 꼬임 방지를 위해 이전 음성 초기화
      const utterance = new SpeechSynthesisUtterance(msg);
      utterance.lang = "ko-KR";
      utterance.rate = 1.1; // 스피디한 발표를 위해 1.1배속
      window.speechSynthesis.speak(utterance);
    }

    // 선생님 코드의 키보드 기능 완벽 유지
    document.addEventListener('keydown', function(event) {
      const key = event.key;
      if (!isNaN(key) || ['+', '-', '*', '/', '.', '%'].includes(key)) {
        addToDisplay(key);
      } else if (key === 'Enter') {
        calculate();
      } else if (key === 'Backspace') {
        deleteLast();
      } else if (key === 'Escape') {
        clearDisplay();
      }
    });
  </script>
</body>
</html>
