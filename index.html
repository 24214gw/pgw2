                </div>
                <div class="bg-gray-800/50 p-4 rounded-xl border border-gray-700/50">
                    <p class="text-xs text-gray-400">금융 지식 신용 점수</p>
                    <p id="userScore" class="text-2xl font-bold text-blue-400 mt-1">750 점</p>
                </div>
            </div>
            <p class="text-xs text-gray-500 mt-4">※ AI 코칭을 받고 올바른 선택을 하면 자산과 점수가 실시간(Firebase)으로 업데이트됩니다.</p>
        </section>

        <section class="flex-[1.5] bg-gray-900 border border-gray-800 rounded-2xl flex flex-col overflow-hidden h-[500px]">
            <div class="bg-gray-800/50 p-4 border-b border-gray-800 flex items-center justify-between">
                <span class="font-medium text-emerald-400">🤖 AI 자산관리사 '돈쭐이'</span>
                <span id="statusDot" class="inline-block w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
            </div>

            <div id="chatBox" class="flex-1 p-4 overflow-y-auto space-y-4">
                <div class="flex items-start">
                    <div class="bg-gray-800 text-gray-200 p-3 rounded-2xl rounded-tl-none max-w-[80%] text-sm">
                        반갑습니다! 미래의 자산가님. 오늘 하신 소비나 투자 고민을 저에게 말씀해 주세요. '돈쭐'나게 분석해 드립니다!
                    </div>
                </div>
            </div>

            <div class="p-4 border-t border-gray-800 bg-gray-900/50">
                <div class="flex gap-2">
                    <input id="userInput" type="text" placeholder="예) 오늘 세일하는 5만원짜리 신발 살까?" class="flex-1 bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 text-white" onkeydown="if(event.key==='Enter') sendMessage()">
                    <button onclick="sendMessage()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-5 py-3 rounded-xl text-sm transition">
                        전송
                    </button>
                </div>
            </div>
        </section>

    </main>

    <script>
        let currentBalance = 100000;
        let currentScore = 750;

        if (!window.toggleLogin) {
            window.toggleLogin = function() {
                window.isLoggedIn = !window.isLoggedIn;
                const loginBtn = document.getElementById("loginBtn");
                const userInfo = document.getElementById("userInfo");
                
                if(window.isLoggedIn) {
                    loginBtn.innerText = "로그아웃";
                    userInfo.innerText = "CEO 테스트 유저님";
                    userInfo.classList.remove("hidden");
                } else {
                    loginBtn.innerText = "구글 로그인";
                    userInfo.classList.add("hidden");
                }
            };
        }
    </script>

    <script>
        // TODO: 실제 AI를 실시간 가동하려면 본인의 Gemini API 키를 입력하세요!
        const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY"; 

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;

            // 1. 내가 보낸 메시지 화면에 띄우기
            appendMessage(text, 'user');
            input.value = "";

            // 2. 로딩 애니메이션 띄우기
            appendMessage("돈쭐이 분석 중...", 'ai-loading');
            
            // 3. 에러 차단형 AI 반응 엔진 가동
            try {
                let responseText = "";

                // API 키가 없거나 기본 상태일 때 작동하는 시뮬레이터 (발표 안전장치)
                if (!GEMINI_API_KEY || GEMINI_API_KEY === "YOUR_GEMINI_API_KEY") {
                    responseText = await getDemoResponse(text);
                } else {
                    // 실제 API 키가 입력되어 있다면 연동 진행
                    responseText = await callGeminiAPI(text);
                }
                
                // 로딩 창 지우고 대답 넣기
                document.getElementById("chatBox").lastElementChild.remove();
                appendMessage(responseText, 'ai');

                // 4. TTS (음성 읽기) 즉각 실행
                speak(responseText);

            } catch (error) {
                console.error(error);
                document.getElementById("chatBox").lastElementChild.remove();
                // 완전히 네트워크가 끊겼을 때를 대비한 최종 백업 메시지
                const fallbackText = "지금은 소비 계획을 정비할 타이밍입니다. 한 번 더 생각해 보세요.";
                appendMessage(fallbackText, 'ai');
                speak(fallbackText);
            }
        }

        // 대화창 말풍선 렌더링 함수
        function appendMessage(text, sender) {
            const chatBox = document.getElementById("chatBox");
            const msgDiv = document.createElement("div");
            msgDiv.className = "flex " + (sender === 'user' ? "justify-end" : "justify-start");
            
            let bubbleClass = "p-3 rounded-2xl max-w-[80%] text-sm ";
            if(sender === 'user') bubbleClass += "bg-emerald-500 text-white rounded-tr-none";
            else if(sender === 'ai') bubbleClass += "bg-gray-800 text-gray-200 rounded-tl-none";
            else bubbleClass += "bg-gray-800 text-gray-500 italic rounded-tl-none animate-pulse"; 

            msgDiv.innerHTML = `<div class="${bubbleClass}">${text}</div>`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight; 
        }

        // [핵심] API 키 없이도 30초 시연을 캐리하는 무적의 데모 함수
        function getDemoResponse(inputText) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    let reply = "";
                    if (inputText.includes("신발") || inputText.includes("사") || inputText.includes("지출")) {
                        currentBalance -= 35000;
                        currentScore -= 15;
                        reply = "지출이 발생했군! 신발을 꼭 사야 했나? 자산이 35,000원 줄었고 신용 점수가 깎였다. 다음엔 참아라!";
                    } else if (inputText.includes("돈") || inputText.includes("저축") || inputText.includes("알바")) {
                        currentBalance += 50000;
                        currentScore += 20;
                        reply = "훌륭하다! 저축과 수입 창출은 금융 자산가로 가는 지름길이지. 자산과 금융 신용 지식을 보상으로 주마!";
                    } else {
                        currentScore += 5;
                        reply = "흥미로운 금융 질문이군. 합리적인 예산 범위 내에서 판단했다면 인정하겠다. 자산관리에 계속 집중해라!";
                    }

                    // 대시보드 실시간 그래픽 갱신 효과
                    document.getElementById("userBalance").innerText = currentBalance.toLocaleString() + " 원";
                    document.getElementById("userScore").innerText = currentScore + " 점";

                    // 파이어베이스 저장 트리거 동기화
                    if(typeof window.dbSave === 'function') {
                        window.dbSave(currentBalance, currentScore);
                    }

                    resolve(reply);
                }, 800); // 0.8초의 리얼한 생각 시간 부여
            });
        }

        // 실제 라이브 Gemini API 허브
        async function callGeminiAPI(prompt) {
            const systemInstruction = "너는 청소년을 위한 깐깐한 AI 자산관리사 '돈쭐이'야. 경제적 개념을 섞어 반말로 딱 2문장 이내로 충고해줘.";
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
            
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: systemInstruction + "\n\n질문: " + prompt }] }]
                })
            });
            const data = await response.json();
            return data.candidates[0].content.parts[0].text;
        }

        // 웹 표준 TTS 엔진 가동
        function speak(text) {
            window.speechSynthesis.cancel(); 
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = "ko-KR";
            speech.rate = 1.1; 
            window.speechSynthesis.speak(speech);
        }
    </script>
