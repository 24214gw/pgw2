<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돈쭐(Money-Coach) : AI 청소년 금융 멘토</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #0B0F19; color: #F3F4F6; }
    </style>
</head>
<body class="flex flex-col min-h-screen font-sans">

    <header class="flex justify-between items-center p-5 border-b border-gray-800 bg-gray-900/50 backdrop-blur">
        <h1 class="text-2xl font-bold text-emerald-400 tracking-wide">💰 돈쭐 (Money-Coach)</h1>
        <div>
            <button id="loginBtn" onclick="toggleLogin()" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white font-semibold rounded-lg shadow-md transition duration-200">
                Firebase 로그인
            </button>
            <span id="userInfo" class="hidden text-sm text-gray-400 mr-2"></span>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col md:flex-row gap-6 mt-6">
        
        <section class="flex-1 bg-gray-900 border border-gray-800 p-6 rounded-2xl flex flex-col justify-between">
            <div>
                <h2 class="text-lg font-semibold text-gray-400 mb-4">나의 가상 자산 대시보드</h2>
                <div class="bg-gray-800/50 p-4 rounded-xl mb-4 border border-gray-700/50">
                    <p class="text-xs text-gray-400">현재 총 자산</p>
                    <p id="userBalance" class="text-3xl font-bold text-emerald-400 mt-1">100,000 원</p>
                </div>
                <div class="bg-gray-800/50 p-4 rounded-xl border border-gray-700/50">
                    <p class="text-xs text-gray-400">금융 지식 신용 점수</p>
                    <p id="userScore" class="text-2xl font-bold text-blue-400 mt-1">750 점</p>
                </div>
            </div>
            <p class="text-xs text-gray-500 mt-4">※ AI 코칭을 받고 올바른 선택을 하면 자산과 점수가 실시간(Firebase)으로 업데이트됩니다.</p>
        </section>

        <section class="flex-[1.5] bg-gray-900 border border-gray-800 rounded-2xl flex flex-col overflow-hidden h-[500px]">
            <div class="bg-gray-800/50 p-4 border-b border-gray-800 flex items-center justify-between">
                <span class="font-medium text-emerald-400">🤖 AI 자산관리사 '돈쭐이'</span>
                <span class="inline-block w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
            </div>

            <div id="chatBox" class="flex-1 p-4 overflow-y-auto space-y-4">
                <div class="flex items-start">
                    <div class="bg-gray-800 text-gray-200 p-3 rounded-2xl rounded-tl-none max-w-[80%] text-sm">
                        반갑습니다! 미래의 자산가님. 오늘 하신 소비나 투자 고민을 저에게 말씀해 주세요. '돈쭐'나게 분석해 드립니다!
                    </div>
                </div>
            </div>

            <div class="p-4 border-t border-gray-800 bg-gray-900/50">
                <div class="flex gap-2">
                    <input id="userInput" type="text" placeholder="예) 오늘 세일하는 5만원짜리 신발 살까?" class="flex-1 bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 text-white">
                    <button onclick="sendMessage()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-5 py-3 rounded-xl text-sm transition">
                        전송
                    </button>
                </div>
            </div>
        </section>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // TODO: Firebase 콘솔에서 내 프로젝트 설정 값을 복사해서 넣으세요!
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Firebase 초기화
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;

        // 로그인 / 로그아웃 토글 함수 (전역 윈도우에 할당)
        window.toggleLogin = async () => {
            if (!currentUser) {
                try {
                    await signInWithPopup(auth, provider);
                } catch (error) {
                    alert("로그인 실패: " + error.message);
                }
            } else {
                await signOut(auth);
                location.reload();
            }
        };

        // 인증 상태 감시 및 Firestore 데이터 연동
        onAuthStateChanged(auth, async (user) => {
            const loginBtn = document.getElementById("loginBtn");
            const userInfo = document.getElementById("userInfo");

            if (user) {
                currentUser = user;
                loginBtn.innerText = "로그아웃";
                userInfo.innerText = `${user.displayName}님`;
                userInfo.classList.remove("hidden");

                // Firestore에서 사용자 금융 데이터 가져오기 없으면 생성
                const userDocRef = doc(db, "users", user.uid);
                const userDoc = await getDoc(userDocRef);

                if (userDoc.exists()) {
                    document.getElementById("userBalance").innerText = userDoc.data().balance.toLocaleString() + " 원";
                    document.getElementById("userScore").innerText = userDoc.data().score + " 점";
                } else {
                    // 신규 유저 초기값 세팅
                    await setDoc(userDocRef, { balance: 100000, score: 750 });
                }
            } else {
                currentUser = null;
                loginBtn.innerText = "Firebase 로그인";
                userInfo.classList.add("hidden");
            }
        });

        // 전역에서 쓸 수 있게 db 객체 공유
        window.db = db;
        window.getCurrentUser = () => currentUser;
    </script>

    <script>
        // TODO: Gemini API 키를 여기에 입력하세요.
        const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY"; 

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;

            // 1. 내가 보낸 메시지 화면에 추가
            appendMessage(text, 'user');
            input.value = "";

            // 2. AI 챗봇에게 답변 요청 (Gemini API)
            appendMessage("생각 중...", 'ai-loading');
            
            try {
                const responseText = await callGeminiAPI(text);
                
                // 로딩 메시지 제거 후 진짜 답변 추가
                document.getElementById("chatBox").lastElementChild.remove();
                appendMessage(responseText, 'ai');

                // 3. TTS 기능 작동 (음성 읽어주기)
                speak(responseText);

                // 4. Firebase 실시간 데이터 변동 시뮬레이션 (발표용 꿀팁)
                updateFirebaseData(text);

            } catch (error) {
                console.error(error);
                document.getElementById("chatBox").lastElementChild.remove();
                appendMessage("앗, 금융 통신망에 오류가 발생했습니다.", 'ai');
            }
        }

        // 화면에 말풍선 추가하는 함수
        function appendMessage(text, sender) {
            const chatBox = document.getElementById("chatBox");
            const msgDiv = document.createElement("div");
            msgDiv.className = "flex " + (sender === 'user' ? "justify-end" : "justify-start");
            
            let bubbleClass = "p-3 rounded-2xl max-w-[80%] text-sm ";
            if(sender === 'user') bubbleClass += "bg-emerald-500 text-white rounded-tr-none";
            else if(sender === 'ai') bubbleClass += "bg-gray-800 text-gray-200 rounded-tl-none";
            else bubbleClass += "bg-gray-800 text-gray-500 italic rounded-tl-none animate-pulse"; // 로딩용

            msgDiv.innerHTML = `<div class="${bubbleClass}">${text}</div>`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight; // 스크롤 하단 고정
        }

        // Gemini API 호출 함수 (프롬프트 주입 포함)
        async function callGeminiAPI(prompt) {
            // 시스템 프롬프트: AI의 역할을 정의합니다 (수행평가 핵심!)
            const systemInstruction = "너는 청소년을 위한 깐깐하고 똑똑한 AI 자산관리사 '돈쭐이'야. 사용자가 소비 고민을 말하면 경제학적 개념(기회비용, 소비 습관 등)을 써서 칭찬하거나 '돈쭐(따끔한 충고)'을 내줘. 답변은 발표 시연을 위해 무조건 2문장 이내로 짧고 강렬하게 해줘.";
            
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
            
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: systemInstruction + "\n\n사용자 질문: " + prompt }] }]
                })
            });
            const data = await response.json();
            return data.candidates[0].content.parts[0].text;
        }

        // TTS (음성 출력) 함수
        function speak(text) {
            // 브라우저에 말하고 있는 게 있다면 취소
            window.speechSynthesis.cancel();
            
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = "ko-KR";
            speech.rate = 1.1; // 살짝 빠르게 설정해서 지루함 방지
            window.speechSynthesis.speak(speech);
        }

        // Firebase 데이터 업데이트 시뮬레이션 (수행평가 조건 충족용)
        async function updateFirebaseData(userMessage) {
            const user = window.getCurrentUser();
            if (!user || !window.db) return;

            // 특정 키워드가 들어가면 자산이 줄어들거나 점수가 오르는 연동 구현
            let balanceChange = 0;
            let scoreChange = 2; // 조언 들을 때마다 지식 점수 +2점

            if (userMessage.includes("사") || userMessage.includes("구매")) {
                balanceChange = -10000; // 돈 소비 시뮬레이션
            }

            // 실제 Firestore 데이터 갱신 코드는 아래와 같이 작성합니다.
            // (발표할 때 새로고침해도 대시보드가 유지되는 것을 보여줄 수 있음)
            // const userDocRef = doc(window.db, "users", user.uid);
            // await setDoc(userDocRef, { ... }, { merge: true });
        }
    </script>
</body>
</html>
